<body>

    <main>
      <section>
        <h2>Album</h2>
        <div class="album-set" id="games">
          <h3>World Humanoid Robot Games</h3>
          <div class="album">
            <figure>
              <a href="assets/album/wrc_weightlifting.jpg">
                <img src="assets/album/wrc_weightlifting.jpg" alt="X-Humanoid team with three humanoid robots at the World Humanoid Robot Games weightlifting competition" width="1800" height="1350">

              <figcaption><strong>Team</strong> Weightlifting champion, with the X-Humanoid team.</figcaption>
            </figure>
            <figure>
              <a href="assets/album/robot_weightlifting.jpg">
                <img src="assets/album/robot_weightlifting.jpg" alt="A humanoid robot holding a barbell overhead in the competition arena" width="1280" height="853">
              </a>
              <figcaption><strong>Arena</strong> Overhead lift during the competition.</figcaption>
            </figure>
            <figure>
              <a href="assets/album/robot2_weightlifting.jpg">
                <img src="assets/album/robot2_weightlifting.jpg" alt="A humanoid robot holding a barbell in a lab, supported by a safety tether" width="1170" height="1420">
              </a>
              <figcaption><strong>Lab</strong> A training lift on a safety tether.</figcaption>
            </figure>
          </div>
        </div>
        <div class="album-set" id="travel">
          <h3>Travel</h3>
          <div class="album">

            <a href="assets/album/san_diego.jpg">
              <img src="assets/album/san_diego.jpg" alt="Sea lions resting on the rocks along the San Diego coast" width="1442" height="1080">
            </a>
            <figcaption><strong>San Diego</strong> Sea lions along the coast.</figcaption>
          </figure>
          <figure>
            <a href="assets/album/chicago.jpg">
              <img src="assets/album/chicago.jpg" alt="Chicago skyline at sunset from the 360 observation deck" width="1080" height="1440">
            </a>
            <figcaption><strong>Chicago</strong> Sunset from the 360 observation deck.</figcaption>
          </figure>
          <figure>
            <a href="assets/album/kyoto.jpg">
              <img src="assets/album/kyoto.jpg" alt="A pagoda above Kyoto, with the city and mountains beyond" width="1080" height="1439">
            </a>
            <figcaption><strong>Kyoto</strong> A pagoda above the city.</figcaption>
          </figure>
          <figure>
            <a href="assets/album/kamakura.jpg">
              <img src="assets/album/kamakura.jpg" alt="A hillside shop in Kamakura looking out over the bay" width="1440" height="1080">
            </a>
            <figcaption><strong>Kamakura</strong> Looking out over the bay.</figcaption>

          <figure>
            <a href="assets/album/dunhuang.jpg">
              <img src="assets/album/dunhuang.jpg" alt="A line of camels crossing the dunes at Dunhuang" width="1618" height="1080">

            <a href="assets/album/danxia.jpg">

    <footer>
      <p>Yifeng Xu</p>
    </footer>
  </div>

  <dialog class="lightbox" id="lightbox">
    <img alt="">
    <p></p>
  </dialog>
  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");
    const lightboxCaption = lightbox.querySelector("p");

    document.querySelectorAll(".album a").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        const photo = link.querySelector("img");
        const caption = link.closest("figure").querySelector("figcaption");
        lightboxImg.src = link.href;
        lightboxImg.alt = photo.alt;
        lightboxCaption.textContent = caption.innerText;
        lightbox.showModal();
      });
    });

    lightbox.addEventListener("click", () => lightbox.close());
  </script>
  <script data-goatcounter="https://eigenxu.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
